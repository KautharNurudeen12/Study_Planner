<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Study Planner</title>
<style>
:root{--g:#14532d;--g2:#1f7a45;--tint:#eaf3ed;--line:#dbe4de;--tx:#18241d;--mu:#5d6d63;--bg:#f3f6f4;--w:#fff;--warn:#9a5b00;--warnbg:#fdf3e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.top{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 62px}
.top small{display:block;opacity:.75;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.top h1{margin:2px 0 0;font-size:22px}
main{max-width:720px;margin:-46px auto 0;padding:0 14px 110px}
.card{background:var(--w);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(20,60,35,.06)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--g)}
.hero{display:flex;align-items:center;gap:14px;border-left:5px solid var(--g2)}
.hero .info{flex:1;min-width:0}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:600}
.code{font-family:Georgia,serif;font-size:26px;font-weight:700;color:var(--g);line-height:1.15}
.ttl{font-size:14px;margin:2px 0}
.mu{color:var(--mu);font-size:13px}
.cd{display:inline-block;margin-top:6px;background:var(--tint);color:var(--g);font-weight:600;font-size:13px;padding:3px 10px;border-radius:20px}
.ring{position:relative;width:70px;height:70px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--g)}
.ring span{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:10px;color:var(--mu)}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:-1px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:active{background:#0e3d21}
.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.s{padding:7px 14px;font-size:13px}
.link{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer;padding:6px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.tm{width:78px;flex:none;font-size:12px;color:var(--mu);line-height:1.3}
.tm b{display:block;color:var(--tx);font-size:13px}
.cb{width:20px;height:20px;accent-color:var(--g2);flex:none}
.done{text-decoration:line-through;color:var(--mu)}
.bar{height:8px;background:var(--tint);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--g2);border-radius:5px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.now{background:var(--g);color:#fff}.past{background:#e6e9e7;color:var(--mu)}.clash{background:var(--warnbg);color:var(--warn)}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.days button{flex:1;min-width:46px;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:13px;color:var(--mu);cursor:pointer}
.days button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.days button em{display:block;font-style:normal;font-size:10px;opacity:.75}
details summary{cursor:pointer;font-weight:600;color:var(--g);list-style:none}
details summary::before{content:"+ ";}details[open] summary::before{content:"\2212  ";}
.empty{text-align:center;color:var(--mu);padding:22px 8px}
.hide{display:none}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font:inherit;font-size:11px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--g);font-weight:700}

body{background:#eef3ef}
.top{position:relative;overflow:hidden;padding-bottom:70px}
.top::before{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
.top::after{content:"";position:absolute;right:60px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05)}
.top h1{font-size:25px;position:relative}.top small{position:relative}
.card{border-radius:14px;padding:18px;box-shadow:0 3px 10px rgba(20,60,35,.07)}
.tiles{display:flex;gap:10px;margin-bottom:12px}
.tile{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-size:11px;color:var(--mu);box-shadow:0 2px 6px rgba(20,60,35,.05)}
.tile b{display:block;font-family:Georgia,serif;font-size:21px;color:var(--g);line-height:1.2}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font:inherit;color:var(--tx);cursor:pointer;box-shadow:0 2px 6px rgba(20,60,35,.05)}
.les:active{background:var(--tint)}
.les .t{flex:1;display:flex;flex-direction:column;min-width:0}
.num{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.num.on{background:var(--g2);color:#fff}
.pill{background:var(--tint);color:var(--g);font-weight:700;font-size:12px;padding:4px 10px;border-radius:20px}
.back{background:none;border:0;color:var(--g);font:inherit;font-weight:600;padding:2px 2px 12px;cursor:pointer}
.pts{padding-left:20px;margin:10px 0 0}.pts li{margin-bottom:10px}
.qt{font-weight:600;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px;background:#fff;border:1.5px solid var(--line);border-radius:10px;font:inherit;color:var(--tx);cursor:pointer}
.opt.ok{background:#e3f3e8;border-color:var(--g2);color:var(--g);font-weight:600}
.opt.no{background:#fbeaea;border-color:#c0392b;color:#8e2a20}
.exp{background:var(--tint);border-radius:8px;padding:10px;font-size:13px;color:var(--g);margin-top:4px}
</style>
</head>
<body>
<div class="top"><small id="date"></small><h1>Study Planner</h1></div>
<main>
<section id="home"></section><section id="table" class="hide"></section><section id="study" class="hide"></section>
<section id="courses" class="hide"></section><section id="journal" class="hide"></section>
</main>
<nav id="nav">
<button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Today</button>
<button data-v="table"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Timetable</button>
<button data-v="study"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v13a2 2 0 012-2h6z"/></svg>Study</button>
<button data-v="courses"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Progress</button>
<button data-v="journal"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg>Journal</button>
</nav>
<script src="materials.js"></script>
<script>
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],SH=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],ORDER=[1,2,3,4,5,6,0],KEY="studyPlannerV2";
var SEED=[
["GNS 111","Communication in English, Use of Library and ICT",1,"08:00","10:00"],
["CSC 101","Introduction to Computer Science",1,"10:00","12:00"],
["CSC 131","Principles of Programming Languages I",1,"12:00","13:00"],
["EST 113","Learning Theories for ICT Teachers",1,"14:00","15:30"],
["EDU 101","Introduction to Teaching and Foundations of Education",2,"10:00","12:00"],
["PHY 101","General Physics I",3,"08:00","10:00"],
["EDM 111","Principles and Practice of Educational Management",3,"08:00","10:00"],
["EST 111","Challenges and Opportunities for ICT Teachers in the Lagos Megacity",3,"10:00","12:00"],
["MAT 101","Elementary Mathematics I (Algebra and Trigonometry)",4,"08:00","10:00"],
["PHY 107","General Physics Practical I",5,"10:00","13:00"]];
var S={classes:[],topics:{},journal:[],scores:{}},sel=new Date().getDay();
if(sel===0||sel===6)sel=1;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){
 try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);S.classes=d.classes||[];S.topics=d.topics||{};S.journal=d.journal||[];S.scores=d.scores||{};return}}catch(e){}
 S.classes=SEED.map(function(a){return{id:uid(),code:a[0],title:a[1],day:a[2],start:a[3],end:a[4],venue:""}});save();
}
function mins(t){var p=t.split(":");return+p[0]*60+ +p[1]}
function fmt(t){var p=t.split(":"),h=+p[0],a=h>=12?"pm":"am";h=h%12||12;return h+":"+p[1]+a}
function codes(){var s={},o=[];S.classes.forEach(function(c){if(!s[c.code]){s[c.code]=c.title;o.push(c.code)}});Object.keys(S.topics).forEach(function(k){if(!(k in s)){s[k]="";o.push(k)}});return{list:o,titles:s}}
function prog(c){var t=S.topics[c]||[],d=t.filter(function(x){return x.done}).length;return{d:d,n:t.length,p:t.length?Math.round(d/t.length*100):0}}
function overall(){var d=0,n=0;Object.keys(S.topics).forEach(function(c){var p=prog(c);d+=p.d;n+=p.n});return{d:d,n:n,p:n?Math.round(d/n*100):0}}
function clashes(c){return S.classes.filter(function(o){return o.id!==c.id&&o.day===c.day&&mins(o.start)<mins(c.end)&&mins(c.start)<mins(o.end)})}
function nextClass(){
 var now=new Date(),nm=now.getDay()*1440+now.getHours()*60+now.getMinutes(),best=null;
 S.classes.forEach(function(c){var s=c.day*1440+mins(c.start),e=c.day*1440+mins(c.end),d=s-nm,ip=nm>=s&&nm<e;if(d<0)d+=10080;if(ip)d=0;if(!best||d<best.d)best={c:c,d:d,ip:ip}});
 return best;
}
function until(m){if(m<=0)return"In progress now";var d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60,p=[];if(d)p.push(d+(d>1?" days":" day"));if(h)p.push(h+" hr");if(mm&&!d)p.push(mm+" min");return"Starts in "+p.join(" ")}
function ring(p){var r=29,c=2*Math.PI*r;return'<div class="ring"><svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="'+r+'" fill="none" stroke="#eaf3ed" stroke-width="7"/><circle cx="35" cy="35" r="'+r+'" fill="none" stroke="#1f7a45" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p/100))+'" transform="rotate(-90 35 35)"/></svg><b>'+p+'%</b><span>overall</span></div>'}

function home(){
 var n=nextClass(),h="",o=overall();
 if(!n){document.getElementById("home").innerHTML='<div class="card empty">No classes yet. Add one in the Timetable tab.</div>';return}
 var c=n.c,tp=S.topics[c.code]||[],open=tp.filter(function(x){return!x.done});
 h+='<div class="card hero"><div class="info"><div class="lbl">'+(n.ip?"Class in progress":"Next class")+'</div><div class="code">'+esc(c.code)+'</div><div class="ttl">'+esc(c.title)+'</div><div class="mu">'+DAYS[c.day]+", "+fmt(c.start)+" to "+fmt(c.end)+(c.venue?" · "+esc(c.venue):"")+'</div><span class="cd">'+until(n.d)+'</span></div>'+ring(o.p)+'</div>';
 var sv=Object.keys(S.scores||{}).map(function(k){return S.scores[k]}),qs=sv.length?Math.round(sv.reduce(function(a,x){return a+x.b/x.n},0)/sv.length*100)+"%":"--";
 h+='<div class="tiles"><div class="tile"><b>'+S.classes.length+'</b>classes a week</div><div class="tile"><b>'+o.d+'/'+o.n+'</b>topics done</div><div class="tile"><b>'+qs+'</b>quiz average</div></div>';
 h+='<div class="card"><h2>Study before '+esc(c.code)+'</h2>';
 if(!tp.length)h+='<div class="mu">No topics yet. Open the Courses tab and add what you need to read for this course.</div>';
 else if(!open.length)h+='<div class="mu">Every topic for this course is done.</div>';
 else open.forEach(function(x){h+='<label class="item"><input class="cb" type="checkbox" data-c="'+esc(c.code)+'" data-id="'+x.id+'"><span class="t">'+esc(x.text)+'</span></label>'});
 var hasM=(window.MATERIALS||[]).some(function(m){return m.code===c.code});
 h+=(hasM?'<button class="btn s" data-open="'+esc(c.code)+'" style="margin-top:10px">Open study materials</button>':'')+'</div>';
 var td=new Date(),nm=td.getHours()*60+td.getMinutes(),list=S.classes.filter(function(x){return x.day===td.getDay()}).sort(function(a,b){return mins(a.start)-mins(b.start)});
 h+='<div class="card"><h2>Today, '+DAYS[td.getDay()]+'</h2>';
 if(!list.length)h+='<div class="mu">No classes today.</div>';
 list.forEach(function(x){var tag=nm>=mins(x.end)?'<span class="tag past">Done</span>':(nm>=mins(x.start)?'<span class="tag now">Now</span>':"");h+='<div class="item"><div class="tm"><b>'+fmt(x.start)+'</b>'+fmt(x.end)+'</div><div class="t"><b>'+esc(x.code)+'</b>'+tag+'<div class="mu">'+esc(x.title)+'</div></div></div>'});
 document.getElementById("home").innerHTML=h+'</div>';
}

function table(){
 var h='<div class="days">'+ORDER.map(function(d){var k=S.classes.filter(function(c){return c.day===d}).length;return'<button data-day="'+d+'" class="'+(d===sel?"on":"")+'">'+SH[d]+'<em>'+k+(k===1?" class":" classes")+'</em></button>'}).join("")+'</div>';
 var list=S.classes.filter(function(c){return c.day===sel}).sort(function(a,b){return mins(a.start)-mins(b.start)});
 h+='<div class="card"><h2>'+DAYS[sel]+'</h2>';
 if(!list.length)h+='<div class="mu">No classes on this day.</div>';
 list.forEach(function(c){var cl=clashes(c);h+='<div class="item"><div class="tm"><b>'+fmt(c.start)+'</b>'+fmt(c.end)+'</div><div class="t"><b>'+esc(c.code)+'</b>'+(cl.length?'<span class="tag clash">Clash with '+esc(cl.map(function(x){return x.code}).join(", "))+'</span>':"")+'<div class="mu">'+esc(c.title)+'</div><div class="mu">'+(c.venue?esc(c.venue):"Venue to be confirmed")+'</div></div><button class="link" data-edit="'+c.id+'">Venue</button><button class="link" data-del="'+c.id+'">Remove</button></div>'});
 h+='</div><div class="card"><details><summary>Add a class</summary><div style="margin-top:12px"><div class="row"><input id="aCode" placeholder="Code (e.g. CSC 111)"><select id="aDay">'+ORDER.map(function(d){return'<option value="'+d+'"'+(d===sel?" selected":"")+'>'+DAYS[d]+'</option>'}).join("")+'</select></div><input id="aTitle" placeholder="Course title" style="margin-bottom:8px"><div class="row"><input id="aStart" type="time" value="08:00"><input id="aEnd" type="time" value="10:00"></div><input id="aVenue" placeholder="Venue (optional)" style="margin-bottom:10px"><button class="btn" id="addClass">Add class</button></div></details></div>';
 document.getElementById("table").innerHTML=h;
}

function courses(){
 var cs=codes(),o=overall(),h='<div class="card hero">'+'<div class="info"><div class="lbl">Overall progress</div><div class="code">'+o.p+'%</div><div class="mu">'+o.d+' of '+o.n+' topics completed</div></div>'+ring(o.p)+'</div>';
 cs.list.forEach(function(c){
  var p=prog(c),tp=S.topics[c]||[];
  h+='<div class="card"><h2>'+esc(c)+'</h2><div class="mu">'+esc(cs.titles[c]||"")+'</div><div class="bar"><i style="width:'+p.p+'%"></i></div><div class="mu">'+p.d+" of "+p.n+" topics · "+p.p+'%</div><div style="margin-top:8px">';
  tp.forEach(function(x){h+='<div class="item"><input class="cb" type="checkbox" data-c="'+esc(c)+'" data-id="'+x.id+'"'+(x.done?" checked":"")+'><span class="t'+(x.done?" done":"")+'">'+esc(x.text)+'</span><button class="link" data-rt="'+esc(c)+'" data-id="'+x.id+'">Remove</button></div>'});
  h+='</div><div class="row" style="margin:10px 0 0"><input placeholder="Add a topic" data-in="'+esc(c)+'"><button class="btn o" style="flex:none" data-add="'+esc(c)+'">Add</button></div></div>';
 });
 document.getElementById("courses").innerHTML=h;
}

function journal(){
 var cs=codes().list,h='<div class="card"><h2>New entry</h2><select id="jc" style="margin-bottom:8px"><option value="">General</option>'+cs.map(function(c){return'<option>'+esc(c)+'</option>'}).join("")+'</select><textarea id="jt" placeholder="What did you study today? What method worked for you?" style="margin-bottom:10px"></textarea><button class="btn" id="addJ">Save entry</button></div>';
 if(!S.journal.length)h+='<div class="empty">No entries yet.</div>';
 S.journal.slice().reverse().forEach(function(j){h+='<div class="card"><div class="lbl">'+esc(j.date)+(j.course?" · "+esc(j.course):"")+'</div><p style="white-space:pre-wrap;margin:6px 0 10px">'+esc(j.text)+'</p><button class="btn o s" data-share="'+j.id+'">Share</button><button class="link" data-dj="'+j.id+'">Delete</button></div>'});
 document.getElementById("journal").innerHTML=h;
}
function all(){home();table();study();courses();journal()}

document.getElementById("nav").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b)});
 ["home","table","study","courses","journal"].forEach(function(v){document.getElementById(v).classList.toggle("hide",v!==b.dataset.v)});
 window.scrollTo(0,0);
});
document.addEventListener("change",function(e){
 var t=e.target;if(t.type==="checkbox"&&t.dataset.c){(S.topics[t.dataset.c]||[]).forEach(function(x){if(x.id===t.dataset.id)x.done=t.checked});save();all()}
});
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;var d=t.dataset;
 if(d.day){sel=+d.day;table()}
 if(t.id==="addClass"){
  var code=document.getElementById("aCode").value.trim().toUpperCase(),s=document.getElementById("aStart").value,en=document.getElementById("aEnd").value;
  if(!code||!s||!en){alert("Enter the course code and both times.");return}
  if(mins(en)<=mins(s)){alert("End time must be after start time.");return}
  var dy=+document.getElementById("aDay").value;
  S.classes.push({id:uid(),code:code,title:document.getElementById("aTitle").value.trim(),day:dy,start:s,end:en,venue:document.getElementById("aVenue").value.trim()});sel=dy;save();all();
 }
 if(d.del&&confirm("Remove this class from your timetable?")){S.classes=S.classes.filter(function(c){return c.id!==d.del});save();all()}
 if(d.edit){var c=S.classes.filter(function(x){return x.id===d.edit})[0],v=prompt("Venue for "+c.code+":",c.venue||"");if(v!==null){c.venue=v.trim();save();all()}}
 if(d.add){var inp=document.querySelector('input[data-in="'+d.add.replace(/"/g,'\\"')+'"]'),v=inp?inp.value.trim():"";if(!v)return;(S.topics[d.add]=S.topics[d.add]||[]).push({id:uid(),text:v,done:false});save();all()}
 if(d.rt){S.topics[d.rt]=S.topics[d.rt].filter(function(x){return x.id!==d.id});save();all()}
 if(t.id==="addJ"){var tx=document.getElementById("jt").value.trim();if(!tx)return;S.journal.push({id:uid(),course:document.getElementById("jc").value,text:tx,date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})});save();all()}
 if(d.dj&&confirm("Delete this entry?")){S.journal=S.journal.filter(function(j){return j.id!==d.dj});save();all()}
 if(d.share){var j=S.journal.filter(function(x){return x.id===d.share})[0],m=(j.course?j.course+": ":"")+j.text;
  if(navigator.share)navigator.share({title:"Study note",text:m}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(m).then(function(){alert("Copied. Paste it into WhatsApp or any chat.")});
  else prompt("Copy this note:",m)}
});
var stv={c:null,l:null,quiz:false},qa={};
function findL(id){var r=null;(window.MATERIALS||[]).forEach(function(m){m.lessons.forEach(function(l){if(l.id===id)r={m:m,l:l}})});return r}
function isDone(c,id){return(S.topics[c]||[]).some(function(x){return x.id===id&&x.done})}
function syncLessons(){(window.MATERIALS||[]).forEach(function(m){var t=S.topics[m.code]=S.topics[m.code]||[];m.lessons.forEach(function(l){if(!t.some(function(x){return x.id===l.id}))t.push({id:l.id,text:l.title,done:false})})});save()}
function best(id){var s=S.scores&&S.scores[id];return s?s.b+" / "+s.n:null}
function study(){
 var el=document.getElementById("study"),h="",M=window.MATERIALS||[];
 if(!M.length){el.innerHTML='<div class="card empty">Study materials did not load. Make sure materials.js is uploaded.</div>';return}
 if(!stv.c){
  h+='<div class="card"><h2>Study library</h2><div class="mu">Pick a course, read the lesson, then test yourself with the quiz. Finished lessons count toward your progress.</div></div>';
  M.forEach(function(m){var p=prog(m.code);h+='<button class="les" data-sc="'+m.code+'"><span class="t"><b>'+m.code+'</b><span class="mu">'+m.title+'</span></span><span class="pill">'+p.d+'/'+p.n+'</span></button>'});
 }else if(!stv.l){
  var m=M.filter(function(x){return x.code===stv.c})[0];
  h+='<button class="back" data-sb="c">&larr; All courses</button><div class="card"><div class="lbl">'+m.code+'</div><h2>'+m.title+'</h2></div>';
  m.lessons.forEach(function(l,i){var b=best(l.id),dn=isDone(m.code,l.id);h+='<button class="les" data-sl="'+l.id+'"><span class="num'+(dn?' on':'')+'">'+(dn?'&#10003;':i+1)+'</span><span class="t"><b>'+l.title+'</b><span class="mu">'+(b?'Best quiz score: '+b:'Quiz not taken yet')+'</span></span></button>'});
 }else{
  var f=findL(stv.l),l=f.l,c=f.m.code,dn=isDone(c,l.id);
  if(!stv.quiz){
   h+='<button class="back" data-sb="l">&larr; '+c+' lessons</button><div class="card"><div class="lbl">'+c+'</div><h2>'+l.title+'</h2><p>'+l.intro+'</p><ul class="pts">'+l.pts.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul></div>';
   h+='<div class="row"><button class="btn'+(dn?' o':'')+'" data-mk="1">'+(dn?'Studied (tap to undo)':'Mark as studied')+'</button><button class="btn o" data-qz="1">Take quiz</button></div>';
  }else{
   var n=l.quiz.length,ans=Object.keys(qa).length,sc=0;
   h+='<button class="back" data-sb="q">&larr; Back to lesson</button><div class="card"><div class="lbl">Quiz</div><h2>'+l.title+'</h2></div>';
   l.quiz.forEach(function(q,i){
    if(qa[i]===q.a)sc++;
    h+='<div class="card"><div class="lbl">Question '+(i+1)+' of '+n+'</div><p class="qt">'+q.q+'</p>';
    q.o.forEach(function(o,j){var k='opt';if(qa[i]!==undefined){if(j===q.a)k+=' ok';else if(j===qa[i])k+=' no'}h+='<button class="'+k+'" data-qi="'+i+'" data-qo="'+j+'"'+(qa[i]!==undefined?' disabled':'')+'>'+o+'</button>'});
    if(qa[i]!==undefined)h+='<div class="exp">'+q.e+'</div>';
    h+='</div>';
   });
   if(ans===n){var pc=Math.round(sc/n*100);h+='<div class="card hero"><div class="info"><div class="lbl">Your score</div><div class="code">'+sc+' / '+n+'</div><div class="mu">'+(pc>=75?'Well done. You are ready to move on.':pc>=50?'Fair. Re-read the lesson and try again.':'Read the lesson again, then retry.')+'</div></div>'+ring(pc)+'</div><div class="row"><button class="btn" data-qr="1">Retry quiz</button><button class="btn o" data-sb="q">Back to lesson</button></div>'}
  }
 }
 el.innerHTML=h;
}
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;var d=t.dataset,go=false;
 if(d.sc){stv={c:d.sc,l:null,quiz:false};go=true}
 if(d.sl){stv.l=d.sl;stv.quiz=false;qa={};go=true}
 if(d.sb==="c"){stv={c:null,l:null,quiz:false};go=true}
 if(d.sb==="l"){stv.l=null;stv.quiz=false;qa={};go=true}
 if(d.sb==="q"){stv.quiz=false;qa={};go=true}
 if(d.qz){stv.quiz=true;qa={};go=true}
 if(d.qr){qa={};go=true}
 if(d.mk){var f=findL(stv.l);(S.topics[f.m.code]||[]).forEach(function(x){if(x.id===f.l.id)x.done=!x.done});save();all()}
 if(d.qi!==undefined){qa[+d.qi]=+d.qo;var g=findL(stv.l),l=g.l;if(Object.keys(qa).length===l.quiz.length){var sc=0;l.quiz.forEach(function(q,i){if(qa[i]===q.a)sc++});var o=S.scores[l.id];if(!o||sc>o.b||o.n!==l.quiz.length){S.scores[l.id]={b:sc,n:l.quiz.length};save()}home()}study()}
 if(d.open){stv={c:d.open,l:null,quiz:false};study();document.querySelector('nav button[data-v="study"]').click()}
 if(go){study();window.scrollTo(0,0)}
});
load();syncLessons();
document.getElementById("date").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
all();setInterval(home,60000);
if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
